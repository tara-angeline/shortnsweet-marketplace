<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Admin | Short N' Sweet</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>


<!-- header -->
<div th:replace="~{fragments/admin_header :: admin_header}"></div>

<!-- Main Content -->
<main class="admin-signup-page">
  <div class="signup-container">
    <div class="signup-content">
      <h1>Create New Admin</h1>

      <!-- Sign Up Form -->
      <form th:action="@{/admin/register}" method="post" class="signup-form">
        <!-- Error Message -->
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <!-- Success Message -->
        <div th:if="${param.adminCreated}" class="success-message">Admin account created successfully!</div>

        <!-- First Name Field -->
        <div class="form-group">
          <label for="firstname">First Name</label>
          <div class="input-wrapper">
            <img class="input-icon" th:src="@{/svg/account-icon.svg}" alt="Firstname Icon" width="24" height="24">
            <input
                    type="text"
                    id="firstname"
                    name="firstname"
                    placeholder="Enter your first name"
                    required
                    th:value="${firstname}">
          </div>
        </div>

        <!-- Last Name Field -->
        <div class="form-group">
          <label for="lastname">Last Name</label>
          <div class="input-wrapper">
            <img class="input-icon" th:src="@{/svg/account-icon.svg}" alt="Lastname Icon" width="24" height="24">
            <input
                    type="text"
                    id="lastname"
                    name="lastname"
                    placeholder="Enter your last name"
                    required
                    th:value="${lastname}">
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <img class="input-icon" th:src="@{/svg/email-icon.svg}" alt="Email Icon" width="24" height="24">
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                    th:value="${email}">
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <img class="input-icon" th:src="@{/svg/lock-icon.svg}" alt="Password Icon" width="24" height="24">
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    required
                    minlength="8">
            <img class="toggle-password" th:src="@{/svg/eye-icon.svg}" alt="Show/Hide Password" width="24" height="24" onclick="togglePassword()">
          </div>
          <small class="password-hint">Password must be at least 8 characters</small>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <img class="input-icon" th:src="@{/svg/lock-icon.svg}" alt="Password Icon" width="24" height="24">
            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your Password"
                    required
                    minlength="8">
            <img class="toggle-password" th:src="@{/svg/eye-icon.svg}" alt="Show/Hide Password" width="24" height="24" onclick="togglePassword()">
          </div>
        </div>

        <!-- Register Button -->
        <button type="submit" class="register-btn">Create Admin</button>


      </form>
    </div>
  </div>
</main>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
