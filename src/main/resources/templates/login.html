<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Short N' Sweet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/header :: header}"></div>


<!-- Main Content -->
<main class="signin-page">
    <div class="signin-container">
        <div class="signin-content">
            <h1>Sign in</h1>
            <p class="signup-link">
                Don't have an account?
                <a th:href="@{/register}">Sign up here!</a>
            </p>

            <form th:action="@{/login}" method="post" class="signin-form">

                <div th:if="${param.error}" class="error-message">Invalid username or password.</div>

                <div th:if="${message}" class="success-message" th:text="${message}"></div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <img class="input-icon" th:src="@{/svg/email-icon.svg}" alt="Email Icon" width="24" height="24">
                        <input type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                required
                                th:value="${email}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <img class="input-icon" th:src="@{/svg/lock-icon.svg}" alt="Password Icon" width="24" height="24">
                        <input type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your Password"
                                required>
                        <img class="toggle-password" th:src="@{/svg/eye-icon.svg}" alt="Show/Hide Password" width="24" height="24" onclick="togglePassword()">
                    </div>
                </div>

                <button type="submit" class="login-btn">Login</button>

            </form>
        </div>
    </div>
</main>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
