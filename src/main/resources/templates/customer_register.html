<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Short N' Sweet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>


<!-- header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<main class="signup-page">
    <div class="signup-container">
        <div class="signup-content">
            <h1>Sign up</h1>
            <p class="signin-link">
                Already have an account?
                <a th:href="@{/login}">Log in here!</a>
            </p>

            <form th:action="@{/register}" method="post" class="signup-form">

                <div th:if="${error}" class="error-message" th:text="${error}"></div>
                <div th:if="${param.registered}" class="success-message">Customer account created successfully!</div>

                <div class="form-group">
                    <label for="firstname">First Name</label>
                    <div class="input-wrapper">
                        <i class='bx input-icon bx-user'></i>
                        <input
                                type="text"
                                id="firstname"
                                name="firstname"
                                placeholder="Enter your first name"
                                required
                                th:value="${firstname}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name</label>
                    <div class="input-wrapper">
                        <i class='bx input-icon bx-user'></i>
                        <input
                                type="text"
                                id="lastname"
                                name="lastname"
                                placeholder="Enter your last name"
                                required
                                th:value="${lastname}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class='bx input-icon bx-envelope'></i>
                        <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                required
                                th:value="${email}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class='bx input-icon bx-lock'></i>
                        <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your Password"
                                required
                                minlength="8">
                        <i class='bx bx-show toggle-password' onclick="togglePassword(this)"></i>
                    </div>
                    <small class="password-hint">Password must be at least 8 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class='bx input-icon bx-lock'></i>
                        <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your Password"
                                required
                                minlength="8">
                        <i class='bx bx-show toggle-password' onclick="toggleConfirmPassword(this)"></i>
                    </div>
                </div>

                <button type="submit" class="register-btn">Create Account</button>


            </form>
        </div>
    </div>
</main>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
