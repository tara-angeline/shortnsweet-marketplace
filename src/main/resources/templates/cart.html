<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Short N' Sweet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-page">
    <div class="container">
        <h1>Your Cart</h1>

        <p class="cart-summary"
           th:text="'You have ' + ${#lists.size(cartItems)} + ' item' + (${#lists.size(cartItems)} > 1 ? 's' : '') + ' in your cart'">
            You have 2 items in your cart
        </p>

        <div class="cart-content">

            <!-- Cart Items Section -->
            <section class="cart-items">

                <div th:if="${#lists.isEmpty(cartItems)}">
                    <p>Your cart is empty.</p>
                    <a th:href="@{/shop}">Back to shop</a>
                </div>

                <div th:each="item : ${cartItems}" class="cart-item">
                    <div class="item-image">
                        <img th:if="${item.image != null}" th:src="${item.image}" th:alt="${item.name}">
                        <img th:if="${item.image == null}" th:src="@{/img/placeholder.png}" alt="Product image">
                    </div>

                    <div class="item-details">
                        <h3 th:text="${item.name}">Dark Chocolate</h3>
                    </div>

                    <div class="item-quantity">
                        <!-- remove quantity -->
                        <form th:action="@{/cart/update}" method="post" style="display:inline;">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input type="hidden" name="quantity" th:value="${item.quantity - 1}">
                            <button class="qty-btn" type="submit" th:disabled="${item.quantity <= 1}">▼</button>
                        </form>

                        <input type="number" th:value="${item.quantity}" min="1" readonly>

                        <!-- add quantity -->
                        <form th:action="@{/cart/update}" method="post" style="display:inline;">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input type="hidden" name="quantity" th:value="${item.quantity + 1}">
                            <button class="qty-btn" type="submit">▲</button>
                        </form>
                    </div>

                    <div class="item-price">
                        <span th:text="'$' + ${#numbers.formatDecimal(item.unitPrice, 1, 2)}">$10.99</span>
                    </div>

                    <div class="item-remove">
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <button class="remove-btn" type="submit">🗑️</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Order Summary Section -->
            <aside class="order-summary" th:if="${!#lists.isEmpty(cartItems)}">
                <div class="summary-content">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span th:text="'$' + ${#numbers.formatDecimal(subtotal, 1, 2)}">$21.98</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span th:text="'$' + ${#numbers.formatDecimal(shipping, 1, 2)}">$4.00</span>
                    </div>

                    <div class="summary-row total">
                        <span>Total (Tax incl.)</span>
                        <span th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}">$25.98</span>
                    </div>

                    <form th:action="@{/checkout}" method="post">
                        <button type="submit" class="checkout-btn">
                            <span th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}">$25.98</span>
                            <span>Checkout</span>
                            <span class="arrow">→</span>
                        </button>
                    </form>
                </div>
            </aside>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
