<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Short N' Sweet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-page">
    <div class="container">
        <h1>Your Cart</h1>

        <p class="cart-summary">
            <span th:with="qty=${#aggregates.sum(cartItems.![quantity]) ?: 0}"
                  th:text="'You have ' + ${qty} + ' item' + (${qty} != 1 ? 's' : '') + ' in your cart'">
                You have 2 items in your cart
            </span>
        </p>

        <div class="cart-content">

            <section class="cart-items">

                <div th:if="${#lists.isEmpty(cartItems)}" class="no-items">
                    <p>Your cart is empty, let's change that :)</p>
                    <a th:href="@{/shop}" class="btn primary">Start shopping</a>
                </div>

                <div th:each="item : ${cartItems}" class="cart-item">
                    <div class="item-details">
                        <div class="item-image">
                            <img th:if="${item.image != null}" th:src="${item.image}" th:alt="${item.name}">
                            <img th:if="${item.image == null}" th:src="@{/img/placeholder.png}" alt="Product image">
                        </div>

                        <div class="item-name">
                            <h3 th:text="${item.name}">Dark Chocolate</h3>
                            <span th:text="'€' + ${#numbers.formatDecimal(item.unitPrice, 1, 2)}">€10.99</span>
                        </div>
                    </div>

                    <div class="item-action">
                        <div class="item-quantity">
                            <form th:action="@{/cart/update}" method="post">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <input type="hidden" name="quantity" th:value="${item.quantity - 1}">
                                <button class="qty-btn" type="submit" th:disabled="${item.quantity <= 1}">
                                    <i class='bx remove-icon bx-caret-down'></i>
                                </button>
                            </form>

                            <input type="number" th:value="${item.quantity}" min="1" readonly>

                            <form th:action="@{/cart/update}" method="post" style="display:inline;">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <input type="hidden" name="quantity" th:value="${item.quantity + 1}">
                                <button class="qty-btn" type="submit">
                                    <i class='bx remove-icon bx-caret-up'></i>
                                </button>
                            </form>
                        </div>

                        <div class="item-remove">
                            <form th:action="@{/cart/remove}" method="post">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <button class="remove-btn" type="submit">
                                    <i class='bx remove-icon bx-trash'></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="order-summary" th:if="${!#lists.isEmpty(cartItems)}">
                <div class="summary-content">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span th:text="'€' + ${#numbers.formatDecimal(subtotal, 1, 2)}">€21.98</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span th:text="'€' + ${#numbers.formatDecimal(shipping, 1, 2)}">€4.00</span>
                    </div>

                    <div class="summary-row total">
                        <span>Total (Tax incl.)</span>
                        <span th:text="'€' + ${#numbers.formatDecimal(total, 1, 2)}">€25.98</span>
                    </div>

                    <form th:action="@{/checkout}" method="get">
                        <button type="submit" class="checkout-btn">
                            <span>Checkout</span>
                            <span class="arrow">→</span>
                        </button>
                    </form>
                </div>
            </aside>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
