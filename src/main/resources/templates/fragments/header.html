<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header">
    <nav>
        <div class="navbar">

            <i class='bx bx-menu menu-icon'></i>

            <div class="logo">
                <a th:href="@{/}">
                    <img th:src="@{/logo-light.png}" height="20px" width="auto" alt="logo">
                </a>
            </div>

            <div class="nav-links">
                <div class="sidebar-logo">
                    <span class="logo-name">
                        <img th:src="@{/logo-dark.png}" height="20px" width="auto" alt="logo">
                    </span>
                    <i class='bx bx-x close-icon'></i>
                </div>

                <ul class="links">
                    <li>
                        <a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'active'">Home</a>
                    </li>

                    <li>
                        <a th:href="@{/shop}" th:classappend="${activePage == 'shop'} ? 'active'">Shop</a>
                    </li>

                    <li>
                        <a th:href="@{/about}" th:classappend="${activePage == 'about'} ? 'active'">About</a>
                    </li>

                    <li>
                        <a th:href="@{/about#contact}" th:classappend="${activePage == 'contact'} ? 'active'">Contact</a>
                    </li>

                </ul>
            </div>

            <div class="nav-icons">
                <a th:href="@{/cart}">
                    <i class='bx bx-basket'></i>
                </a>
                <a th:href="@{/account}">
                    <i class='bx bx-user'></i>
                </a>
            </div>

        </div>
    </nav>
</header>

</body>
</html>
