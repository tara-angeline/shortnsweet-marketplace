<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header">
    <nav>
        <div class="navbar">

            <img th:src="@{/svg/menu-icon.svg}" alt="Menu" class="menu-icon">

            <div class="logo">
                <a th:href="@{/}">Short N' Sweet</a>
            </div>

            <div class="nav-links">
                <div class="sidebar-logo">
                    <span class="logo-name">Short N' Sweet</span>
                    <img th:src="@{/svg/close-icon.svg}" alt="Close" class="close-icon">
                </div>

                <ul class="links">
                    <li>
                        <a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'active'">Home</a>
                    </li>

                    <li>
                        <a th:href="@{/shop}" th:classappend="${activePage == 'shop'} ? 'active'">Shop</a>
                    </li>

                    <li>
                        <a th:href="@{/about}" th:classappend="${activePage == 'about'} ? 'active'">About</a>
                    </li>

                    <li>
                        <a href="https://linktr.ee/tara_ava_angeline" target="_blank">Contact</a>
                    </li>

                </ul>
            </div>

            <div class="nav-icons">
                <a th:href="@{/cart}">
                    <img th:src="@{/svg/cart-icon.svg}" alt="Cart" width="24" height="24">
                </a>
                <a th:href="@{/account}">
                    <img th:src="@{/svg/account-icon.svg}" alt="Account" width="24" height="24">
                </a>
            </div>

        </div>
    </nav>
</header>

</body>
</html>
