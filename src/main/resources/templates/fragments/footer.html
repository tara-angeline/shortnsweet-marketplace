<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer" class="footer">
  <div class="container footer-container">

    <div class="footer-left">
      <img th:src="@{/logo-light.png}" height="20px" width="auto" alt="logo">

      <p>Tara Ava Angeline &copy; <span th:text="${#dates.year(#dates.createNow())}"></span> - All Rights Reserved</p>
    </div>

    <div class="footer-links">
      <a th:href="@{/}">Home</a>
      <a th:href="@{/shop}">Shop</a>
      <a th:href="@{/about}">About</a>
      <a th:href="@{/about#contact}">Contact</a>
    </div>

    <div class="footer-social">
      <a href="https://instagram.com"><i class='bx bxl-instagram'></i></a>
      <a href="https://tiktok.com"><i class='bx bxl-tiktok'></i></a>
      <a href="https://facebook.com"><i class='bx bxl-facebook'></i></a>
    </div>

  </div>
</footer>

</body>
</html>
