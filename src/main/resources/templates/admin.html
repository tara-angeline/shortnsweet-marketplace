<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Short N' Sweet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/admin_header :: admin_header}"></div>

<section class="hero">
    <div class="hero-content">
        <h1 th:text="'Hello Admin ' + ${user.firstname} + '!'">Hello Admin!</h1>
        <p>
            What are we doing today? :)
        </p>
        <a th:href="@{/logout}" class="btn">Logout</a>
    </div>

    <div class="hero-image">
        <!-- hero image -->
    </div>
</section>

<section class="admin-page">
    <h2>Dashboard</h2>

    <div class="admin-action-grid">
        <a class="admin-action-card" th:href="@{/admin/products}">
            <i class='bx admin-icon bx-box'></i>
            <h3>Manage Products</h3>
            <p>Create, edit, or delete products.</p>
        </a>

        <a class="admin-action-card" th:href="@{/admin/orders}">
            <i class='bx admin-icon bx-clipboard'></i>
            <h3>Manage Orders</h3>
            <p>View orders and update statuses.</p>
        </a>

        <a class="admin-action-card" th:href="@{/admin/register}">
            <i class='bx admin-icon bx-user-plus'></i>
            <h3>Register Admin</h3>
            <p>Create new admin credentials.</p>
        </a>

    </div>
</section>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
