<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${product.name} + ' | Short N Sweet'">Product</title>
  <link rel="stylesheet" th:href="@{/css/productdetail.css}">
</head>
<body>


<!-- header -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="product-detail">
  <div class="product-detail-container">

    <div class="product-image">
      <img th:src="@{${product.image}}" th:alt="${product.name}">
    </div>

    <div class="product-info">
      <h1 th:text="${product.name}">Product Name</h1>

      <p class="short-desc" th:text="${product.shortDescription}">
        short description
      </p>

      <p class="long-desc" th:text="${product.longDescription}">
        description
      </p>

      <div class="price-row">
        <span class="price" th:text="'€' + ${product.price}">€0.00</span>
        <span class="stock" th:text="'Stock: ' + ${product.stock}">Stock</span>
      </div>

      <form th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">
        <button type="submit" class="add-to-cart-btn">Add to Cart</button>
      </form>

      <a th:href="@{/shop}" class="back-link">← Back to shop</a>
    </div>

  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
