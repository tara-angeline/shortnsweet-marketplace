<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${product.name} + ' | Short N` Sweet'"></title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>


<!-- header -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="product-detail">
  <div class="product-detail-container">

    <div class="product-image">
      <img th:src="@{${product.image}}" th:alt="${product.name}">
    </div>

    <div class="product-info">
      <h1 th:text="${product.name}">Product Name</h1>

      <p class="short-desc" th:text="${product.shortDescription}">
        short description
      </p>

      <div class="price-row">
        <span class="price" th:text="'€' + ${product.price}">€0.00</span>
        <span class="stock" th:text="'Stock: ' + ${product.stock}">Stock</span>
      </div>

      <form th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">
        <button type="submit" class="add-to-cart-btn">Add to Cart</button>
      </form>

      <a th:href="@{/shop}" class="back-link">← Back to shop</a>

      <div class="long-desc" th:utext="${product.longDescription}"></div>
    </div>

    <section class="related">
      <h2>Related Products</h2>

      <div class="product-grid">
        <div th:each="product : ${products}" class="product-card"
             th:onclick="|window.location='@{/productdetail(id=${product.id})}'|">
          <img th:src="@{${product.image}}" alt="Product Image">
          <h3 th:text="${product.name}">Product Name</h3>
          <p th:text="${product.shortDescription}">Product description</p>
        </div>
      </div>
    </section>

  </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
