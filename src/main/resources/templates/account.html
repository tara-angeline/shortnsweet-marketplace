<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Account | Short N' Sweet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="account-page">
  <h1>My Account</h1>
  <h2>Welcome back, <span class="user-name" th:text="${user.firstname}"></span>!</h2>

  <div class="account-info">
    <p><strong>Name:</strong> <span th:text="${user.firstname} + ' ' + ${user.lastname}"></span></p>
    <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
  </div>

  <a class="btn primary" th:href="@{/logout}">Logout</a>

  <section class="account-orders">
    <h2>Order History</h2>

    <div th:if="${orders == null || #lists.isEmpty(orders)}" class="no-orders">
      <p>You have no orders yet.</p>
      <a th:href="@{/shop}" class="btn primary">Start shopping</a>
    </div>

    <div th:if="${orders != null && !#lists.isEmpty(orders)}">
      <div th:each="o : ${orders}" class="order-card">
        <div class="order-header">
          <div class="order-info">
            <strong>Order #</strong><span th:text="${o.id}">1</span><br>
            <span class="muted">Placed:</span> <span th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}">date</span><br>
            <span class="muted">Status:</span> <span th:text="${o.status}">PLACED</span>
          </div>
          <div class="order-total">
            <strong>Total:</strong> <span th:text="'€' + ${#numbers.formatDecimal(o.total, 1, 2)}">€0.00</span>
          </div>
        </div>

        <div class="order-items">
          <table class="order-items-table">
            <thead>
            <tr>
              <th>Item</th>
              <th class="right">Price</th>
              <th class="right">Qty</th>
              <th class="right">Line</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${o.items}">
              <td th:text="${it.oldName}">Name</td>
              <td class="right" th:text="${#numbers.formatDecimal(it.oldPrice, 1, 2)}">0.00</td>
              <td class="right" th:text="${it.quantity}">1</td>
              <td class="right" th:text="${#numbers.formatDecimal(it.oldPrice * it.quantity, 1, 2)}">0.00</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
