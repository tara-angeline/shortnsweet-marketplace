<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Form | Short N' Sweet</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/admin_header :: admin_header}"></div>

<section class="admin-orderform-page">
  <a th:href="@{/admin/orders}" class="btn back-btn">← Back</a>

  <h1>Order #<span th:text="${order.id}">1</span></h1>

  <div th:if="${param.updated}" class="success-message">Order updated.</div>
  <div th:if="${error}" class="error-message" th:text="${error}"></div>

  <div class="order-meta-grid">
    <div class="order-meta-card">
      <p><strong>Customer Name:</strong>
        <span th:text="|${order.user.firstname} ${order.user.lastname}|">Lorem Ipsum</span>
      </p>

      <p><strong>Customer Email:</strong>
        <span th:text="${order.user.email}">email@example.com</span>
      </p>

      <p><strong>Date:</strong>
        <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">date</span>
      </p>

      <p><strong>Total:</strong>
        <span th:text="${#numbers.formatDecimal(order.total,1,2)}">0.00</span>
      </p>
    </div>

    <div class="order-meta-card">
      <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post" class="status-form">
        <label for="status"><strong>Status</strong></label>
        <div class="status-row">
          <select id="status" name="status">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}"
                    th:selected="${s == order.status}">
            </option>
          </select>
          <button class="btn primary" type="submit">Update</button>
        </div>
      </form>
    </div>
  </div>

  <h2>Order Items</h2>

  <div class="table-card">
    <table class="admin-table">
      <thead>
      <tr>
        <th>Item</th>
        <th>Price (at purchase)</th>
        <th>Qty</th>
        <th>Line</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="it : ${order.items}">
        <td th:text="${it.oldName}">Name</td>
        <td th:text="${#numbers.formatDecimal(it.oldPrice,1,2)}">0.00</td>
        <td th:text="${it.quantity}">1</td>
        <td th:text="${#numbers.formatDecimal(it.oldPrice * it.quantity,1,2)}">0.00</td>
      </tr>
      </tbody>
    </table>
  </div>
</section>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/script.js}"></script>


</body>
</html>
