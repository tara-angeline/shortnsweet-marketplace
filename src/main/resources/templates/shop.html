<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Short N' Sweet | Dessertbox Dublin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- css -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/header :: header}"></div>

<section class="shop-hero">
    <div class="hero-content">
        <h1>Fancy a sweet treat?</h1>

        <form th:action="@{/shop/search}" method="get" class="search-bar">
            <input
                    type="text"
                    name="q"
                    placeholder="We can fix that ;)"
            >
        </form>
    </div>
</section>

<section class="shop-products">
    <div class="product-grid">

        <div class="product-card"
             th:each="product : ${products}"
             th:onclick="|window.location='@{/productdetail(id=${product.id})}'|">

            <img th:src="@{${product.image}}"
                 th:alt="${product.name}">

            <h3 th:text="${product.name}">Product Name</h3>

            <p th:text="${product.shortDescription}">
                Short description
            </p>

            <span class="price"
                  th:text="'€' + ${product.price}">
                €0.00
            </span>
        </div>

    </div>
</section>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
