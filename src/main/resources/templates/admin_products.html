<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View All Products | Short N' Sweet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/admin_header :: admin_header}"></div>

<section class="admin-products-page">

    <div class="admin-products-header">
        <h1 class="admin-products-title">Products</h1>

        <a th:href="@{/admin/products/add}" class="back-link">
            + Add Product
        </a>
    </div>

    <!--
    <div th:if="${param.created}" class="success-message">Product created.</div>
    <div th:if="${param.updated}" class="success-message">Product updated.</div>
    <div th:if="${param.deleted}" class="success-message">Product deleted.</div>
    -->

    <div class="admin-products-table-card">

        <table class="admin-products-table">
            <thead>
            <tr>
                <th>Image</th>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th class="admin-products-actions-header">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${products}" class="admin-products-row">

                <td class="admin-products-image">
                    <img th:src="@{${p.image}}" th:alt="${p.name}">
                </td>

                <td th:text="${p.id}"></td>

                <td class="admin-products-name" th:text="${p.name}"></td>

                <td th:text="${p.price}"></td>

                <td th:text="${p.stock}"></td>

                <td class="admin-products-actions">

                    <a th:href="@{'/admin/products/' + ${p.id} + '/edit'}">
                        <button class="btn success" type="submit">Edit</button>
                    </a>

                    <form th:if="${p.active}"
                          th:action="@{'/admin/products/' + ${p.id} + '/hide'}"
                          method="post">
                        <button class="btn danger" type="submit">Hide</button>
                    </form>

                    <form th:if="${!p.active}"
                          th:action="@{'/admin/products/' + ${p.id} + '/unhide'}"
                          method="post">
                        <button class="btn primary" type="submit">Unhide</button>
                    </form>

                </td>

            </tr>
            </tbody>
        </table>

    </div>

</section>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
