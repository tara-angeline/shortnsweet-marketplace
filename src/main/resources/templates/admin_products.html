<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Products - Short N' Sweet</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- header -->
<div th:replace="~{fragments/admin_header :: admin_header}"></div>

<section class="admin">
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1>Products</h1>
        <a class="btn" th:href="@{/admin/products/add}">
            <button class="btn primary">+ Add Product</button>
        </a>
    </div>

<!--    <div th:if="${param.created}" class="success-message">Product created.</div>-->
<!--    <div th:if="${param.updated}" class="success-message">Product updated.</div>-->
<!--    <div th:if="${param.deleted}" class="success-message">Product deleted.</div>-->

    <table class="admin-table">
        <thead>
        <tr>
            <th>Image</th>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td><img th:src="@{${p.image}}" th:alt="${p.name}"></td>
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td style="display:flex; gap:8px;">
                <a class="btn" th:href="@{'/admin/products/' + ${p.id} + '/edit'}">
                    <button class="btn primary">Edit</button>
                </a>

                <form th:action="@{'/admin/products/' + ${p.id} + '/delete'}" method="post">
                    <button class="btn danger" type="submit">Delete</button>
                </form>

            </td>
        </tr>
        </tbody>
    </table>
</section>

<!-- footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
